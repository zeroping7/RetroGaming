<script type="module">
// Pruebas sin frameworks (constitución Q3): cada una monta un estado, avanza y comprueba.
import { W, FLOOR, R, crear, paso, codificar, decodificar, soltarObjeto, TIPOS, ARMAS, AVISO_TIEMPO, COMBO_SEG, VEL_HEX, moverBurbujas, MAX_OBJETOS, OBJ_EN_SUELO, ESPERA_DISPARO, FIJO_SEG, SEP_TRIPLE, RAPIDO_SEG, RELOJ_SEG, EVENTOS } from './sim.js';

const pruebas = [];
const prueba = (nombre, fn) => pruebas.push({ nombre, fn });
function igual(a, b, que) { if (a !== b) throw new Error(`${que}: esperaba ${b} y salió ${a}`); }
function cierto(v, que) { if (!v) throw new Error(que); }

const nada = () => ({ left: false, right: false, a: false });
const quietos = (st) => st.ps.map(nada);
const DT = 1 / 60;
function avanzar(st, seg, entradas = quietos(st)) { for (let t = 0; t < seg; t += DT) paso(st, entradas, DT); }
function jugando(n) { const st = crear(n); avanzar(st, 1.5); igual(st.state, 'play', 'tras la cuenta inicial'); return st; }

prueba('1 jugador empieza con 3 vidas, nivel 1 y una burbuja de tamaño 3', () => {
  const st = crear(1);
  igual(st.lives, 3, 'vidas'); igual(st.lvl, 1, 'nivel'); igual(st.balls.length, 1, 'burbujas'); igual(st.balls[0].s, 3, 'tamaño');
  igual(st.state, 'ready', 'fase');
});

prueba('2 jugadores comparten 5 vidas y tienen una burbuja más', () => {
  const st = crear(2);
  igual(st.lives, 5, 'vidas'); igual(st.ps.length, 2, 'jugadores'); igual(st.balls.length, 2, 'burbujas');
});

prueba('El jugador se mueve y no sale de la pantalla', () => {
  const st = jugando(1);
  st.balls = [];
  st.balls.push({ s: 1, x: 20, y: 30, vx: 0, vy: 0 }); // lejos, para que no acabe el nivel
  avanzar(st, 5, [{ left: false, right: true, a: false }]);
  igual(st.ps[0].x, W - st.ps[0].w / 2, 'pegado al borde derecho');
});

prueba('Un arpón parte una burbuja grande en dos del tamaño inferior y suma puntos', () => {
  const st = jugando(1);
  const p = st.ps[0];
  st.balls = [{ s: 3, x: p.x, y: 200, vx: 0, vy: 0 }];
  paso(st, [{ left: false, right: false, a: true }], DT);
  avanzar(st, 0.6);
  igual(st.balls.length, 2, 'burbujas');
  cierto(st.balls.every((b) => b.s === 2), 'las dos de tamaño 2');
  igual(st.score, 40, 'puntos por una de tamaño 3');
  igual(p.arpones.length, 0, 'el arpón desaparece al tocar');
});

prueba('La burbuja más pequeña desaparece y, sin burbujas, el nivel se limpia (+500)', () => {
  const st = jugando(1);
  const p = st.ps[0];
  st.balls = [{ s: 1, x: p.x, y: 300, vx: 0, vy: 0 }];
  paso(st, [{ left: false, right: false, a: true }], DT);
  avanzar(st, 0.5);
  igual(st.state, 'clear', 'fase'); igual(st.score, 600 + st.bono, 'puntos (100 + 500 + bonus de tiempo)');
  avanzar(st, 2.3);
  igual(st.lvl, 2, 'pasa al nivel 2');
});

prueba('Si una burbuja toca al jugador, pierde una vida y se reinicia el nivel', () => {
  const st = jugando(1);
  const p = st.ps[0];
  st.balls = [{ s: 2, x: p.x, y: FLOOR - 20, vx: 0, vy: 0 }];
  paso(st, quietos(st), DT);
  igual(st.state, 'dead', 'fase'); igual(st.lives, 2, 'vidas');
  const ronda = st.ronda;
  avanzar(st, 1.4);
  igual(st.state, 'ready', 'vuelve a empezar'); cierto(st.ronda > ronda, 'cuenta como ronda nueva');
});

prueba('Sin vidas: fin de partida y, al pulsar disparo, pide otra', () => {
  const st = jugando(1);
  st.lives = 1;
  st.balls = [{ s: 2, x: st.ps[0].x, y: FLOOR - 20, vx: 0, vy: 0 }];
  avanzar(st, 1.4);
  igual(st.state, 'over', 'fase');
  avanzar(st, 1.1);
  paso(st, [{ left: false, right: false, a: true }], DT);
  igual(st.state, 'again', 'pide partida nueva');
});

prueba('La entrada x acerca al jugador a esa posición (invitado online)', () => {
  const st = jugando(2);
  st.balls = [{ s: 1, x: 20, y: 30, vx: 0, vy: 0 }];
  avanzar(st, 1, [nada(), { left: false, right: false, a: false, x: 100 }]);
  cierto(Math.abs(st.ps[1].x - 100) < 1, 'llega a x = 100');
});

prueba('Las burbujas rebotan y no salen de la pantalla', () => {
  const st = jugando(1);
  st.balls = [{ s: 4, x: 50, y: 100, vx: -300, vy: 0 }];
  for (let t = 0; t < 5; t += DT) {
    paso(st, [{ left: false, right: false, a: false, x: W - 13 }], DT);
    const b = st.balls[0];
    cierto(b.x - R[4] >= -0.01 && b.x + R[4] <= W + 0.01 && b.y + R[4] <= FLOOR + 0.01, 'dentro de la pantalla');
    if (st.state !== 'play') break;
  }
});

prueba('Cada tick guarda la posición anterior para interpolar el dibujo (y no viaja por la red)', () => {
  const st = jugando(1);
  st.balls = [{ s: 2, x: 100, y: 100, vx: 70, vy: 0 }];
  paso(st, [{ left: false, right: true, a: false }], DT);
  const b = st.balls[0], p = st.ps[0];
  igual(b.ax, 100, 'burbuja: x anterior'); cierto(b.x > 100, 'burbuja: se ha movido');
  cierto(p.ax < p.x, 'jugador: x anterior a la izquierda');
  const d = codificar(st);
  cierto(!JSON.stringify(d).includes('ax'), 'la instantánea no lleva ax');
});

// ---------- Objetos (spec 002, T010) ----------
// Revienta n burbujas pequeñas, una a una, delante del jugador 1
function reventar(st, n) {
  let hechas = 0;
  while (hechas < n) {
    st.state = 'play'; st.tiempo = 1e9;
    st.balls = [{ s: 1, x: st.ps[0].x, y: 300, vx: 0, vy: 0 }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
    st.objetos.length = 0;
    st.ps[0].arpones.length = 0;
    paso(st, [{ left: false, right: false, a: true }], DT);
    for (let k = 0; k < 40 && st.balls.length === 2; k++) paso(st, quietos(st), DT);
    hechas++;
    if (st.objetos.length) return hechas;
  }
  return 0;
}

prueba('Cae un objeto aproximadamente en 1 de cada 8 burbujas', () => {
  const st = jugando(1);
  let objetos = 0;
  const N = 800;
  for (let i = 0; i < N; i++) {
    st.state = 'play'; st.tiempo = 1e9; st.objetos.length = 0; st.ps[0].arpones.length = 0;
    st.balls = [{ s: 1, x: st.ps[0].x, y: 300, vx: 0, vy: 0 }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
    paso(st, [{ left: false, right: false, a: true }], DT);
    for (let k = 0; k < 40 && st.balls.length === 2; k++) paso(st, quietos(st), DT);
    if (st.objetos.length) objetos++;
  }
  const r = objetos / N;
  cierto(r > 0.08 && r < 0.17, `proporción ${r.toFixed(3)} lejos de 0,125`);
});

prueba('Con la misma semilla caen los mismos objetos (repetible)', () => {
  const a = crear(1, 1234), b = crear(1, 1234);
  avanzar(a, 1.5); avanzar(b, 1.5);
  const na = reventar(a, 200), nb = reventar(b, 200);
  igual(na, nb, 'misma burbuja'); igual(a.objetos[0].tipo, b.objetos[0].tipo, 'mismo tipo');
});

prueba('Nunca hay más de 2 objetos en pantalla', () => {
  const st = jugando(1);
  for (let i = 0; i < 3; i++) soltarObjeto(st, 30 + i * 20, 100);
  // el tercero lo pone a mano; el juego no debe soltar más mientras haya 2
  st.objetos.length = MAX_OBJETOS;
  for (let i = 0; i < 200; i++) {
    st.state = 'play'; st.tiempo = 1e9; st.ps[0].arpones.length = 0;
    st.balls = [{ s: 1, x: st.ps[0].x, y: 300, vx: 0, vy: 0 }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
    paso(st, [{ left: false, right: false, a: true }], DT);
    for (let k = 0; k < 40 && st.balls.length === 2; k++) paso(st, quietos(st), DT);
    cierto(st.objetos.length <= MAX_OBJETOS, 'máximo 2');
  }
});

prueba('El objeto cae al suelo, espera 10 s y desaparece si nadie lo coge', () => {
  const st = jugando(1);
  st.balls = [{ s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
  st.ps[0].x = 350;
  soltarObjeto(st, 60, 200, 'doble');
  avanzar(st, 1.5, [{ left: false, right: false, a: false, x: 350 }]);
  const o = st.objetos[0];
  cierto(o && o.enSuelo >= 0, 'ya está en el suelo'); igual(o.y, FLOOR - 8, 'apoyado en el suelo');
  st.balls[0].x = 5; st.balls[0].y = 20; st.balls[0].vx = 0;
  avanzar(st, OBJ_EN_SUELO - 1, [{ left: false, right: false, a: false, x: 350 }]);
  igual(st.objetos.length, 1, 'a los 9 s sigue');
  avanzar(st, 1.2, [{ left: false, right: false, a: false, x: 350 }]);
  igual(st.objetos.length, 0, 'a los 10 s desaparece');
});

prueba('Al tocar un objeto se recoge y da 100 puntos', () => {
  const st = jugando(1);
  st.balls = [{ s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
  soltarObjeto(st, st.ps[0].x, 400, 'escudo');
  avanzar(st, 1.5);
  igual(st.objetos.length, 0, 'recogido'); igual(st.score, 100, 'puntos');
});

prueba('Al morir o pasar de nivel se borran los objetos', () => {
  const st = jugando(1);
  soltarObjeto(st, 40, 100, 'reloj');
  st.balls = [{ s: 2, x: st.ps[0].x, y: FLOOR - 20, vx: 0, vy: 0 }];
  avanzar(st, 1.4);
  igual(st.objetos.length, 0, 'tras morir');
});

// ---------- Armas (spec 002) ----------
const disparo = { left: false, right: false, a: true };
function soloLejos(st) { st.balls = [{ s: 1, x: 5, y: 20, vx: 0, vy: 0 }]; }

prueba('Arpón normal: un solo arpón a la vez aunque se mantenga pulsado', () => {
  const st = jugando(1); soloLejos(st);
  avanzar(st, 0.5, [disparo]);
  igual(st.ps[0].arpones.length, 1, 'arpones');
});

prueba('Arpón doble: al cogerlo, hasta 2 arpones a la vez, separados por la espera', () => {
  const st = jugando(1); soloLejos(st);
  soltarObjeto(st, st.ps[0].x, 450, 'doble');
  avanzar(st, 1.0);
  igual(ARMAS[st.ps[0].arma], 'doble', 'arma recogida');
  paso(st, [disparo], DT);
  igual(st.ps[0].arpones.length, 1, 'el primero sale al momento');
  avanzar(st, ESPERA_DISPARO / 2, [disparo]);
  igual(st.ps[0].arpones.length, 1, 'el segundo espera');
  avanzar(st, ESPERA_DISPARO, [disparo]);
  igual(st.ps[0].arpones.length, 2, 'dos a la vez');
  avanzar(st, 0.3, [disparo]);
  igual(st.ps[0].arpones.length, 2, 'nunca más de dos');
});

prueba('Cada arpón del doble rompe burbujas por su cuenta', () => {
  const st = jugando(1);
  st.ps[0].arma = ARMAS.indexOf('doble');
  st.balls = [{ s: 1, x: 100, y: 200, vx: 0, vy: 0 }, { s: 1, x: 300, y: 200, vx: 0, vy: 0 }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
  st.ps[0].x = 100; paso(st, [disparo], DT);
  st.ps[0].x = 300; avanzar(st, ESPERA_DISPARO + DT, [{ left: false, right: false, a: true, x: 300 }]);
  avanzar(st, 0.8, [{ left: false, right: false, a: false, x: 300 }]);
  igual(st.balls.length, 1, 'quedan solo la lejana'); igual(st.score, 300, 'dos pequeñas seguidas: 100 + 100 x2 de combo');
});

prueba('Al morir se pierde el arma; al pasar de nivel se conserva', () => {
  const st = jugando(2);
  st.ps[0].arma = 1; st.ps[1].arma = 1;
  st.balls = [{ s: 2, x: st.ps[0].x, y: FLOOR - 20, vx: 0, vy: 0 }];
  avanzar(st, 1.4);
  igual(st.ps[0].arma, 0, 'el tocado vuelve al normal'); igual(st.ps[1].arma, 1, 'el otro la conserva');
  st.state = 'play'; st.balls = [];
  avanzar(st, 2.4);
  igual(st.lvl, 2, 'pasa de nivel'); igual(st.ps[1].arma, 1, 'sigue con el doble');
});

// Coge un objeto: lo suelta encima del jugador y espera a que caiga
function coger(st, tipo, i = 0) {
  soltarObjeto(st, st.ps[i].x, 450, tipo);
  const ent = st.ps.map((p, j) => ({ left: false, right: false, a: false, x: p.x }));
  avanzar(st, 1.0, ent);
}

prueba('Arpón fijo: se clava en el techo 3 s y luego desaparece', () => {
  const st = jugando(1); soloLejos(st);
  coger(st, 'fijo');
  igual(ARMAS[st.ps[0].arma], 'fijo', 'arma');
  paso(st, [disparo], DT);
  avanzar(st, 1.2);
  const a = st.ps[0].arpones[0];
  cierto(a && a.top === 0 && a.clavado > 0, 'clavado en el techo');
  avanzar(st, FIJO_SEG - 0.5);
  igual(st.ps[0].arpones.length, 1, 'sigue clavado');
  avanzar(st, 0.8);
  igual(st.ps[0].arpones.length, 0, 'se suelta a los 3 s');
});

prueba('Arpón fijo clavado revienta lo que lo toca y entonces desaparece', () => {
  const st = jugando(1); soloLejos(st);
  st.ps[0].arma = ARMAS.indexOf('fijo');
  paso(st, [disparo], DT);
  avanzar(st, 1.2);
  st.balls.push({ s: 1, x: st.ps[0].x + 4, y: 100, vx: 0, vy: 0 });
  avanzar(st, 0.1);
  igual(st.balls.length, 1, 'rota (queda la lejana)'); igual(st.ps[0].arpones.length, 0, 'el arpón se va');
});

prueba('Arpón triple: tres líneas separadas 24 px y no vuelve a disparar hasta que no queda ninguna', () => {
  const st = jugando(1); soloLejos(st);
  st.ps[0].arma = ARMAS.indexOf('triple');
  paso(st, [disparo], DT);
  const xs = st.ps[0].arpones.map((a) => a.x);
  igual(xs.length, 3, 'tres arpones');
  igual(Math.round(xs[1] - xs[0]), SEP_TRIPLE, 'separación'); igual(Math.round(xs[2] - xs[1]), SEP_TRIPLE, 'separación');
  avanzar(st, 0.5, [disparo]);
  igual(st.ps[0].arpones.length, 3, 'no salen más mientras quedan');
  avanzar(st, 0.6);
  igual(st.ps[0].arpones.length, 0, 'llegan al techo');
  paso(st, [disparo], DT);
  igual(st.ps[0].arpones.length, 3, 'otra vez tres');
});

prueba('Velocidad: el arpón sube más rápido durante 10 s', () => {
  const st = jugando(1); soloLejos(st);
  paso(st, [disparo], DT); avanzar(st, 0.3);
  const normal = st.ps[0].arpones[0].top;
  avanzar(st, 1.5);
  coger(st, 'velocidad');
  cierto(st.ps[0].rapido > 0, 'activo');
  paso(st, [disparo], DT); avanzar(st, 0.3);
  cierto(st.ps[0].arpones[0].top < normal - 50, 'sube más');
  avanzar(st, RAPIDO_SEG);
  igual(st.ps[0].rapido <= 0, true, 'se acaba');
});

prueba('Escudo: aguanta un golpe, luego 1 s sin daño, y al siguiente golpe se pierde la vida', () => {
  const st = jugando(1); soloLejos(st);
  coger(st, 'escudo');
  cierto(st.ps[0].escudo, 'tiene escudo');
  st.balls.push({ s: 2, x: st.ps[0].x, y: FLOOR - 20, vx: 0, vy: 0 });
  paso(st, quietos(st), DT);
  igual(st.state, 'play', 'no muere'); igual(st.lives, 3, 'mismas vidas'); igual(st.ps[0].escudo, false, 'escudo gastado');
  avanzar(st, 1.2);
  st.balls = [{ s: 2, x: st.ps[0].x, y: FLOOR - 20, vx: 0, vy: 0 }];
  paso(st, quietos(st), DT);
  igual(st.state, 'dead', 'ahora sí');
});

prueba('Dinamita: todas las burbujas pasan al tamaño más pequeño', () => {
  const st = jugando(1);
  st.balls = [{ s: 4, x: 100, y: 100, vx: 0, vy: 0 }, { s: 2, x: 300, y: 100, vx: 0, vy: 0 }];
  st.ps[0].x = 200;
  coger(st, 'dinamita');
  cierto(st.balls.every((b) => b.s === 1), 'todas pequeñas'); igual(st.balls.length, 8 + 2, 'una de 4 da 8 y una de 2 da 2');
});

prueba('Reloj: congela las burbujas 5 s, siguen haciendo daño y se pueden romper', () => {
  const st = jugando(1);
  st.balls = [{ s: 2, x: 60, y: 200, vx: 70, vy: 0 }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
  st.ps[0].x = 250;
  coger(st, 'reloj');
  cierto(st.congelado > 0, 'activo');
  const b = st.balls[0], x0 = b.x, y0 = b.y;
  avanzar(st, 1);
  igual(b.x, x0, 'quieta en x'); igual(b.y, y0, 'quieta en y');
  st.ps[0].x = b.x; paso(st, [disparo], DT); avanzar(st, 0.6);
  cierto(st.balls.every((c) => c.s === 1), 'rota en dos pequeñas');
  const piezas = st.balls.map((c) => c.y);
  avanzar(st, 0.5);
  cierto(st.balls.every((c, i) => c.y === piezas[i]), 'los trozos también quietos');
  avanzar(st, RELOJ_SEG);
  igual(st.congelado, 0, 'se acaba');
});

prueba('Modo de prueba: cae siempre un objeto, de los tipos pedidos y por turnos', () => {
  const st = crear(1, 7, { prueba: ['fijo', 'reloj'] });
  avanzar(st, 1.5);
  const tipos = [];
  for (let i = 0; i < 4; i++) {
    st.state = 'play'; st.tiempo = 1e9; st.objetos.length = 0; st.ps[0].arpones.length = 0;
    st.balls = [{ s: 1, x: st.ps[0].x, y: 300, vx: 0, vy: 0 }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
    paso(st, [disparo], DT);
    for (let k = 0; k < 40 && st.balls.length === 2; k++) paso(st, quietos(st), DT);
    tipos.push(TIPOS[st.objetos[0].tipo]);
  }
  igual(tipos.join(','), 'fijo,reloj,fijo,reloj', 'tipos');
});

prueba('La instantánea lleva arpón fijo clavado, escudo, velocidad y reloj', () => {
  const st = jugando(2); soloLejos(st);
  st.ps[0].arma = ARMAS.indexOf('fijo'); st.ps[1].escudo = true; st.ps[1].rapido = 5; st.congelado = 3;
  paso(st, [disparo, nada()], DT); avanzar(st, 1.2);
  const d = decodificar(JSON.parse(JSON.stringify(codificar(st))));
  const a = d.ps[0].arpones[0];
  cierto(a.fijo && a.clavado > 0, 'arpón fijo clavado'); igual(ARMAS[d.ps[0].arma], 'fijo', 'arma');
  cierto(d.ps[1].escudo && d.ps[1].rapido > 0, 'escudo y velocidad'); cierto(d.congelado > 1.5, 'reloj');
});

// ---------- Eventos para el sonido (spec 003) ----------
const nombres = (st) => { const l = []; for (let i = 0; i < st.eventos.length; i += 2) l.push(EVENTOS[st.eventos[i]] + ':' + st.eventos[i + 1]); st.eventos.length = 0; return l; };

prueba('Eventos: empezar, disparar, reventar (con tamaño), limpiar el nivel', () => {
  const st = crear(1, 3);
  avanzar(st, 1.5);
  cierto(nombres(st).includes('listo:0'), 'empieza el nivel');
  st.balls = [{ s: 1, x: st.ps[0].x, y: 300, vx: 0, vy: 0 }];
  paso(st, [disparo], DT);
  avanzar(st, 0.5);
  const l = nombres(st);
  cierto(l.includes('disparo:0'), 'disparo del J1'); cierto(l.includes('estallido:1'), 'estallido tamaño 1'); cierto(l.includes('limpio:0'), 'nivel limpio');
});

prueba('Eventos: escudo roto, muerte y fin de partida', () => {
  const st = jugando(1); nombres(st);
  st.lives = 1; st.ps[0].escudo = true;
  st.balls = [{ s: 2, x: st.ps[0].x, y: FLOOR - 20, vx: 0, vy: 0 }];
  paso(st, quietos(st), DT);

// ---------- Bloque A de la spec 004 ----------
const pequena = (x, y = 300) => ({ s: 1, x, y, vx: 0, vy: 0 });
function reventarAqui(st, s = 1) {
  st.ps[0].arpones.length = 0; st.ps[0].espera = 0;
  st.balls.push({ s, x: st.ps[0].x, y: 300, vx: 0, vy: 0 });
  const n = st.balls.length;
  paso(st, [disparo], DT);
  for (let k = 0; k < 60 && st.balls.length >= n; k++) paso(st, quietos(st), DT);
}

prueba('Tiempo: el nivel 1 da 60 s y, al acabarse, se pierde una vida sin perder el arma', () => {

  avanzar(st, 1.5); soloLejos(st);
  st.ps[0].arma = 1; st.tiempo = 0.5;
  avanzar(st, 0.6);
  igual(st.state, 'dead', 'fase'); igual(st.lives, 2, 'vidas'); igual(st.hit, -1, 'nadie tocado'); igual(st.ps[0].arma, 1, 'conserva el arma');
});

prueba('Tiempo: avisa cada segundo de los últimos 10', () => {

  igual(st.score, 100 + 200 + 300, 'x1, x2, x3'); igual(st.combo.n, 3, 'combo de 3');
  cierto(st.textos.some((q) => q.k === 0 && q.v === 3), 'se ve «x3»');
  reventarAqui(st, 2);

  avanzar(st, COMBO_SEG + 0.2);

// ---------- Bloque B de la spec 004 ----------
const bloque = (x, y, w, h, duro = false) => ({ x, y, w, h, duro });

prueba('Nivel 1 sin bloques; desde el 2 hay bloques que no se pisan y quedan por encima de los jugadores', () => {
  igual(crear(1, 1).bloques.length, 0, 'nivel 1');
  for (let sem = 1; sem <= 20; sem++) {
    const st = crear(2, sem, { nivel: 6 });
    cierto(st.bloques.length > 0, 'hay bloques');
    for (const k of st.bloques) cierto(k.y + k.h < FLOOR - 80 && k.x >= 0 && k.x + k.w <= W, 'dentro y alto');
    st.bloques.forEach((a, i) => st.bloques.forEach((c, j) => { if (i < j) cierto(a.x + a.w < c.x || c.x + c.w < a.x || a.y + a.h < c.y || c.y + c.h < a.y, 'no se pisan'); }));
  }
});

prueba('Una burbuja que cae sobre un bloque rebota hacia arriba y no lo atraviesa', () => {
  const lista = [{ s: 2, x: 200, y: 250, vx: 0, vy: 200 }], k = bloque(150, 300, 100, 14);
  for (let t = 0; t < 1; t += DT) {
    moverBurbujas(lista, DT, [k]);
    const b = lista[0];
    cierto(!(b.x > k.x && b.x < k.x + k.w && b.y + R[2] > k.y + 2 && b.y < k.y + k.h), 'no atraviesa');
  }
  cierto(lista[0].y < 300, 'sigue por encima');
});

prueba('Una burbuja que llega por un lado rebota hacia atrás', () => {
  const lista = [{ s: 1, x: 120, y: 307, vx: 200, vy: 0, hex: true }];
  for (let t = 0; t < 0.2; t += DT) moverBurbujas(lista, DT, [bloque(150, 300, 60, 14)]);
  cierto(lista[0].vx < 0, 'cambia de sentido'); cierto(lista[0].x + R[1] <= 150.5, 'fuera del bloque');
});

prueba('Hexagonal: sin gravedad, velocidad constante, y se parte en hexagonales', () => {
  const st = jugando(1);
  st.balls = [{ s: 2, x: 100, y: 200, vx: VEL_HEX, vy: -VEL_HEX, hex: true }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];
  avanzar(st, 1, [{ left: false, right: false, a: false, x: 350 }]);

  // una justo encima del jugador, para acertarle
  st.ps[0].arpones.length = 0;
  st.balls = [{ s: 2, x: st.ps[0].x, y: 430, vx: VEL_HEX, vy: -VEL_HEX, hex: true }, { s: 1, x: 5, y: 20, vx: 0, vy: 0 }];

});

prueba('codificar y decodificar dan el mismo estado (redondeado)', () => {

  igual(d.balls.length, st.balls.length, 'burbujas');
  st.balls.forEach((b, i) => { igual(d.balls[i].s, b.s, 'tamaño'); igual(d.balls[i].x, Math.round(b.x), 'x'); });
  igual(d.ps[0].arpones[0].x, Math.round(st.ps[0].arpones[0].x), 'arpón');
  igual(d.ps[1].arpones.length, 0, 'sin arpón el J2');

});

});

const lista = document.getElementById('lista');
let fallos = 0;
for (const { nombre, fn } of pruebas) {
  const li = document.createElement('li');
  try { fn(); li.className = 'ok'; li.textContent = '✓ ' + nombre; }
  catch (e) { fallos++; li.className = 'mal'; li.textContent = '✗ ' + nombre + ' — ' + e.message; }
  lista.appendChild(li);
}
const r = document.getElementById('resumen');
r.className = fallos ? 'mal' : 'ok';
r.textContent = fallos ? `${fallos} de ${pruebas.length} fallan` : `Las ${pruebas.length} pruebas pasan`;
</script>
