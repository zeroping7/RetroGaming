<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d5c"/>
      <stop offset="1" stop-color="#0f0c2b"/>
    </linearGradient>
  </defs>
  <rect width="240" height="260" fill="url(#cielo)"/>

  <!-- burbujas -->
  <circle cx="152" cy="88" r="46" fill="#ff7a4d"/>
  <circle cx="136" cy="72" r="11" fill="#fff" fill-opacity=".55"/>
  <circle cx="66" cy="128" r="28" fill="#6fa8ff"/>
