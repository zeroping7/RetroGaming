    <rect x="160" y="225" width="10" height="4"/><rect x="180" y="225" width="10" height="4"/>
    <rect x="200" y="225" width="10" height="4"/><rect x="220" y="225" width="10" height="4"/>
  </g>

  <!-- jugador 1 -->
  <g shape-rendering="crispEdges">
    <rect x="56" y="203" width="20" height="22" fill="#2ec4b6"/>
