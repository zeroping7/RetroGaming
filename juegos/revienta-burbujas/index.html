<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revienta Burbujas</title>
<meta name="theme-color" content="#0d0b1f">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="icono.png">
<link rel="apple-touch-icon" href="../../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#0d0b1f;--panel:#1a1640;--fg:#f4f1ff;--muted:#a59fd6;--p1:#2ec4b6;--p2:#ff8fc7;--accent:#ffcf3a;--px:"Press Start 2P",ui-monospace,monospace;color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--px);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
canvas{display:block;max-width:100%;max-height:100%;aspect-ratio:400/560;border-radius:6px}
.menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 8px}
.menu h1{font-size:20px;line-height:1.5;text-align:center;margin:0 0 6px;color:var(--accent);text-shadow:3px 3px 0 #5a2bd6}
.menu h2{font-size:9px;color:var(--muted);margin:8px 0 0;letter-spacing:.1em;text-align:center}
.menu button{font:inherit;font-size:11px;padding:14px 18px;border:0;border-radius:10px;cursor:pointer;width:240px;max-width:100%}
.b1{background:var(--p1);color:#03201d}.b2{background:var(--p2);color:#33001a}.b3{background:var(--accent);color:#2a1b00}
.bq{background:var(--panel);color:var(--fg)}
.menu p{font-size:8px;color:var(--muted);text-align:center;line-height:1.8;margin:0;max-width:300px}
.menu input{font:inherit;font-size:18px;text-align:center;letter-spacing:.3em;text-transform:uppercase;width:240px;max-width:100%;padding:12px;border-radius:10px;border:2px solid var(--muted);background:var(--bg);color:var(--fg)}
.err{color:var(--p2)!important}
.menu button.home{font-size:8px;padding:10px 14px;width:auto;margin-top:6px;background:var(--bg);color:var(--muted);border:2px solid var(--panel)}
#pads{display:flex;gap:12px;width:100%;max-width:560px}
.pad{flex:1;display:flex;gap:6px;min-width:0}
.pad button{flex:1;font:inherit;font-size:18px;padding:16px 0;border:0;border-radius:10px;background:var(--panel);color:var(--fg);touch-action:none;min-width:0}
.pad button.fire{flex:1.3;font-size:10px}
#pad1 .fire{background:var(--p1);color:#03201d}#pad2 .fire{background:var(--p2);color:#33001a}
.pad button.on{filter:brightness(1.4)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:8px;color:var(--muted);margin:0;text-align:center;line-height:1.7}
#share{position:absolute;bottom:24%;left:50%;transform:translateX(-50%);font:inherit;font-size:10px;padding:14px 18px;border:0;border-radius:10px;background:var(--accent);color:#2a1b00;cursor:pointer;white-space:nowrap}
#snd{position:absolute;top:5px;right:64px;z-index:2;font-size:16px;line-height:1;padding:6px 8px;border:0;border-radius:6px;background:rgba(0,0,0,.4);color:var(--fg);cursor:pointer}
#quit{position:absolute;top:8px;right:8px;font:inherit;font-size:8px;padding:8px;border:0;border-radius:6px;background:rgba(0,0,0,.4);color:var(--fg);cursor:pointer}
@media (hover:hover) and (pointer:fine){#pads{display:none}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="560"></canvas>
  <button id="quit" hidden>SALIR</button>
  <button id="snd" aria-label="Sonido"></button>
  <button id="share" hidden>COMPARTIR ENLACE</button>
  <div class="menu" id="menu">
    <h1>REVIENTA<br>BURBUJAS</h1>
    <h2>MISMO DISPOSITIVO</h2>
    <button id="m1" class="b1">1 JUGADOR</button>
    <button id="m2" class="b2">2 JUGADORES</button>
    <h2>ONLINE · CADA UNO SU MÓVIL</h2>
    <button id="mh" class="b3">CREAR PARTIDA</button>
    <button id="mj" class="bq">UNIRSE CON CÓDIGO</button>
    <p id="mmsg"></p>
    <button id="mhome" class="bq home">◀ MENÚ RETROGAMING</button>
  </div>
  <div class="menu" id="join" hidden>
    <h1>UNIRSE</h1>
    <p>Escribe el código que ve tu compañero en su pantalla</p>
    <input id="code" type="text" maxlength="4" autocomplete="off" aria-label="Código de partida">
    <button id="jgo" class="b3">ENTRAR</button>
    <button id="jback" class="bq">VOLVER</button>
    <p id="jmsg"></p>
  </div>
</div>
<div id="pads">
  <div class="pad" id="pad1"><button data-p="0" data-k="l" aria-label="Izquierda">◀</button><button data-p="0" data-k="f" class="fire">DISPARO</button><button data-p="0" data-k="r" aria-label="Derecha">▶</button></div>
  <div class="pad" id="pad2" hidden><button data-p="1" data-k="l" aria-label="J2 izquierda">◀</button><button data-p="1" data-k="f" class="fire">J2</button><button data-p="1" data-k="r" aria-label="J2 derecha">▶</button></div>
</div>
<p class="hint">Teclado: ← → y Espacio (J2 local: A D W) · Mando: cruceta o stick y A</p>
<script type="module">
// Página de Revienta Burbujas: menús, controles, red y bucle. Las reglas están en sim.js
// y el dibujo en render.js (constitución A1).
import { W, VEL_JUGADOR, crear, paso, moverBurbujas, moverObjetos, disparar, moverArpones, codificar, decodificar, TIPOS, EVENTOS } from './sim.js';
import { dibujar } from './render.js';
import { crearAudio } from '../../src/audio/sintetizador.js';
import { RECETAS } from './sonidos.js';

const cv=document.getElementById('c'),x=cv.getContext('2d'),$=id=>document.getElementById(id);
const keys=[{l:false,r:false,f:false},{l:false,r:false,f:false}];
let st={state:'menu'},best=0,mode='menu',code='',guestIn={l:false,r:false,f:false},lastSent='',ronda=-1;
let hostState=null,sendAcc=0,gview=null,lastSnap=-1,hostTargetX=0,hostDir=0,guestDir=0,guestLat=0.15,guestXAt=0,guestX=null,lat=0.15,localShotAt=0;
try{best=+localStorage.getItem('rb-best')||0}catch(e){}

/* ---------- sonido (spec 003): sim.js anota eventos y aquí suenan ---------- */
const audio=crearAudio(RECETAS),pendRed=[];
function pintarSnd(){const b=$('snd');b.textContent=audio.silencio?'🔇':'🔊';b.setAttribute('aria-pressed',String(!audio.silencio))}
$('snd').onclick=e=>{e.stopPropagation();audio.alternar();pintarSnd();$('snd').blur()};
addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&!(e.target&&e.target.tagName==='INPUT')){audio.alternar();pintarSnd()}});
pintarSnd();
// Suena una lista plana de pares [código, dato]. `yo`: jugador cuyos disparos ya sonaron (invitado)
function sonar(lista,yo=-1){
  for(let i=0;i+1<lista.length&&i<128;i+=2){
    const n=EVENTOS[lista[i]|0],d=lista[i+1]|0;if(!n)continue;
    if((n==='disparo'||n==='clavado')&&d===yo)continue;
    audio.tocar(n,d);
  }
}

/* ---------- partida: las reglas están en sim.js ---------- */
const ent=[{left:false,right:false,a:false,x:undefined},{left:false,right:false,a:false,x:undefined}]; // reutilizadas (R5)
// Modo de prueba: ?objetos=doble,fijo (o ?objetos=todos) hace que caiga siempre un objeto,
// de esos tipos y por turnos. Solo lo usa quien simula (1-2 jugadores en el móvil o anfitrión).
const PRUEBA=(()=>{const q=new URLSearchParams(location.search).get('objetos');if(!q)return null;
  const l=q==='todos'?TIPOS.slice():q.split(',').map(t=>t.trim().toLowerCase()).filter(t=>TIPOS.includes(t));return l.length?l:null})();
function newGame(n){st=crear(n,undefined,{prueba:PRUEBA});for(const k of keys){k.l=k.r=k.f=false}guestX=null;ronda=st.ronda}
function update(dt){
  for(let i=0;i<st.n;i++){
    const k=mode==='host'&&i===1?guestIn:keys[i],e=ent[i];
    e.left=k.l;e.right=k.r;e.a=k.f;e.x=undefined;
    // invitado online: hacia su última posición conocida, adelantada por el retardo
    if(mode==='host'&&i===1&&guestX!==null){
      const since=Math.min(0.5,guestLat+(performance.now()-guestXAt)/1000);
      e.x=Math.max(13,Math.min(W-13,guestX+guestDir*VEL_JUGADOR*since));
    }
  }
  paso(st,ent,dt);
  if(st.eventos.length){
    sonar(st.eventos);
    if(mode==='host'&&pendRed.length<64)pendRed.push(...st.eventos); // el invitado los oirá con la próxima instantánea
    st.eventos.length=0;
  }
  if(st.ronda!==ronda){ronda=st.ronda;guestX=null}
  if(st.state==='again'){if(mode==='local')toMenu();else newGame(2);return}
  if(st.score>best){best=st.score;try{localStorage.setItem('rb-best',best)}catch(e){}}
}

/* ---------- red (src/net/sala.js): el anfitrión simula, el invitado envía mandos y dibuja ---------- */
let sala=null,heardAt=0,helloAt=0,joinStart=0,netGen=0;
function closeNet(){netGen++;pendRed.length=0;if(sala){sala.cerrar();sala=null}hostState=null;heardAt=0;gview=null;lastSnap=-1;guestX=null;lat=0.15}
function enterOnline(asHost,c){code=c;mode=asHost?'host':'guest';st={state:'wait'};hideMenus();$('pad2').hidden=true;$('quit').hidden=false}
function netInfo(){return sala?(sala.via==='directa'?'DIRECTA':sala.servidores()):''}
function onMsg(tp,d){
  if(mode==='host'&&tp==='in'){heardAt=performance.now();guestIn={l:!!d.l,r:!!d.r,f:!!d.f};guestX=typeof d.x==='number'&&isFinite(d.x)?d.x:null;guestXAt=performance.now();guestDir=Math.max(-1,Math.min(1,d.d|0));guestLat=sala.retardo/2000}
  if(mode==='guest'&&tp==='st'){heardAt=performance.now();hostState=d}
}
// Abre la sala (sin código = crear partida nueva). Si mientras tanto se vuelve al menú, se cierra.
async function openSala(c,asHost,onFail){
  const gen=++netGen;
  try{
    const net=await import('../../src/net/sala.js');
    const s=await net.crearSala({juego:'revienta-burbujas',version:6,codigo:c||net.codigoAleatorio(),escuchar:[asHost?'in':'st'],anfitrion:asHost});
    if(gen!==netGen){s.cerrar();return null}
    sala=s;s.alRecibir(onMsg);return s;
  }catch(e){if(gen===netGen)onFail(e.message&&e.message.startsWith('No se pudo')?e.message:'Sin conexión: el modo online necesita internet.');return null}
}
function host(msgEl){
  msgEl.className='';msgEl.textContent='Creando…';
  openSala(null,true,t=>{msgEl.className='err';msgEl.textContent=t}).then(s=>{if(s)enterOnline(true,s.codigo)});
}
function joinGame(c){
  const m=$('jmsg');m.className='';m.textContent='Entrando…';code=c;
  openSala(c,false,t=>{m.className='err';m.textContent=t}).then(s=>{if(s){enterOnline(false,c);joinStart=performance.now();lastSent=''}});
}
function sendIn(){const k=keys[0];const m={l:k.l,r:k.r,f:k.f};if(gview&&gview.ps&&gview.ps[1]&&gview.state==='play'){m.x=Math.round(gview.ps[1].x);m.d=(k.r?1:0)-(k.l?1:0)}sala.enviar('in',m)}
function netTick(dt){
  const now=performance.now();
  if(mode==='host'){
    if(!heardAt||now-heardAt>4000){if(st.state!=='wait')st={state:'wait'};guestIn={l:false,r:false,f:false};return false}
    if(st.state==='wait')newGame(2);
    return true;
  }
  if(!sala)return false;
  const k=keys[0],s=(k.l?1:0)+(k.r?2:0)+(k.f?4:0)+'';
  const moving=k.l||k.r;
  if(s!==lastSent||now-helloAt>(moving?50:500)){lastSent=s;helloAt=now;sendIn()}
  if(heardAt&&now-heardAt<4000){guestStep(dt);st=gview||{state:'wait'}}
  else{st={state:'wait'};if(!heardAt&&now-joinStart>15000){toMenu();$('mmsg').className='err';$('mmsg').textContent='No hay ninguna partida con ese código.'}}
  return false;
}
function guestStep(dt){
  const now=performance.now();
  if(hostState&&hostState.n!==lastSnap){
    lastSnap=hostState.n;const s=decodificar(hostState);
    if(Array.isArray(hostState.e))sonar(hostState.e,1); // mis disparos ya sonaron al pulsar
    // retardo de ida (la mitad de la ida y vuelta que mide la sala)
    if(sala)lat=sala.retardo/2000;
    if(s&&s.ps.length===2){
      const ahead=Math.min(lat,0.6);
      if(s.state==='play'){
        if(s.congelado>0)s.congelado=Math.max(0,s.congelado-ahead);
        else for(let t=ahead;t>0;t-=1/60)moverBurbujas(s.balls,Math.min(1/60,t));
        moverObjetos(s.objetos,ahead);
        for(const p of s.ps)moverArpones(p,ahead)}
      const keep=gview&&gview.state==='play'&&s.state==='play'&&gview.ps&&gview.ps.length===2;
      hostTargetX=s.ps[0].x+(s.state==='play'?s.ps[0].dir*VEL_JUGADOR*ahead:0);hostDir=s.ps[0].dir;
      if(keep){
        s.ps[0].x=gview.ps[0].x;s.ps[1].x=gview.ps[1].x;
        // mis disparos locales siguen hasta que el anfitrión los confirme (predicción)
        const mio=s.ps[1],antes=gview.ps[1];
        if(mio.arpones.length<antes.arpones.length&&now-localShotAt<lat*2000+250)mio.arpones=antes.arpones;
        mio.espera=antes.espera;
        // mismas burbujas: corrige suave en vez de saltar
        if(s.balls.length===gview.balls.length&&s.balls.every((b,i)=>b.s===gview.balls[i].s)){
          s.balls.forEach((b,i)=>{const o=gview.balls[i],dx=b.x-o.x,dy=b.y-o.y;
            if(dx*dx+dy*dy<60*60){b.x=o.x+dx*0.35;b.y=o.y+dy*0.35}});
        }
      }
      gview=s;
    }
  }
  const v=gview;if(!v||!v.ps||v.ps.length<2)return;
  if(v.state!=='play'){v.t-=dt;return}
  const me=v.ps[1],k=keys[0];
  if(k.l)me.x-=VEL_JUGADOR*dt;if(k.r)me.x+=VEL_JUGADOR*dt;me.x=Math.max(13,Math.min(W-13,me.x));
  if(k.f&&disparar(me)){localShotAt=now;audio.tocar('disparo')}
  hostTargetX=Math.max(13,Math.min(W-13,hostTargetX+hostDir*VEL_JUGADOR*dt));
  v.ps[0].x+=(hostTargetX-v.ps[0].x)*Math.min(1,dt*20);
  v.ps.forEach((p,i)=>{if(moverArpones(p,dt)&&i===1)audio.tocar('clavado')});
  if(v.congelado>0)v.congelado=Math.max(0,v.congelado-dt);else moverBurbujas(v.balls,dt);
  moverObjetos(v.objetos,dt);
  v.pop=v.pop.filter(q=>(q.t-=dt)>0);
}
function sendState(dt){sendAcc+=dt;if(sendAcc<1/25||!sala)return;sendAcc=0;const e=codificar(st);if(pendRed.length){e.e=pendRed.slice(0,64);pendRed.length=0}sala.enviar('st',e)}

/* ---------- dibujo: render.js ---------- */
const vista={modo:'menu',alfa:1,codigo:'',red:'',servidores:'',record:0,ahora:0}; // reutilizada (R5)
function draw(){
  const sh=$('share'),ver=mode==='host'&&st.state==='wait';if(sh.hidden===ver)sh.hidden=!ver;
  vista.modo=mode;vista.alfa=mode==='guest'?1:alfa;vista.codigo=code;vista.record=best;vista.ahora=performance.now();
  vista.servidores=netInfo();vista.red=vista.servidores+(sala&&sala.retardoMedido?'  '+Math.round(sala.retardo)+'ms':'');
  dibujar(x,st,vista);
}

/* ---------- menús ---------- */
function hideMenus(){$('menu').hidden=true;$('join').hidden=true}
function toMenu(){
  closeNet();mode='menu';st={state:'menu'};
  $('menu').hidden=false;$('join').hidden=true;$('pad2').hidden=true;$('quit').hidden=true;$('mmsg').textContent='';
}
function startLocal(n){mode='local';newGame(n);hideMenus();$('pad2').hidden=n<2;$('quit').hidden=false}
$('m1').onclick=()=>startLocal(1);
$('m2').onclick=()=>startLocal(2);
$('mh').onclick=()=>{closeNet();host($('mmsg'))};
$('mj').onclick=()=>{$('menu').hidden=true;$('join').hidden=false;$('jmsg').textContent='';$('code').value='';$('code').focus()};
$('jback').onclick=toMenu;
function doJoin(){const c=$('code').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(c)){$('jmsg').className='err';$('jmsg').textContent='El código tiene 4 letras o números.';return}
  closeNet();joinGame(c)}
$('jgo').onclick=doJoin;
// Compartir la partida (HU-9): abre las apps del móvil o, si no se puede, copia el enlace
$('share').onclick=async()=>{
  const b=$('share'),net=await import('../../src/net/sala.js'),url=net.enlaceDePartida('revienta-burbujas',code);
  if(navigator.share){try{await navigator.share({title:'Revienta Burbujas',text:'¡Juega conmigo a Revienta Burbujas! Código '+code,url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);b.textContent='ENLACE COPIADO'}catch(e){b.textContent='CÓDIGO '+code}
  setTimeout(()=>{b.textContent='COMPARTIR ENLACE'},2000);
};
// Se juega en vertical: si el móvil está en horizontal, aviso "Gira el móvil" (HU-10)
import('../../src/pantalla/orientacion.js').then(m=>m.vigilarOrientacion('revienta-burbujas')).catch(()=>{});
// Entrar con un enlace ?sala=CODIGO: directo a unirse, sin escribirlo
import('../../src/net/sala.js').then(net=>{const c=net.codigoDeUrl();if(!c)return;
  $('menu').hidden=true;$('join').hidden=false;$('code').value=c;closeNet();joinGame(c)}).catch(()=>{});
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')doJoin();e.stopPropagation()});
$('quit').onclick=toMenu;
const toLauncher=()=>{closeNet();location.href='../../'};
$('mhome').onclick=toLauncher;
addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='menu'&&!$('menu').hidden)toLauncher()});

/* ---------- mandos físicos ---------- */
const prev=[{},{}];
function pollPads(){
  let gps=[];try{gps=navigator.getGamepads?[...navigator.getGamepads()].filter(p=>p&&p.connected):[]}catch(e){return}
  gps.slice(0,2).forEach((g,i)=>{
    const ax=g.axes[0]||0,bt=j=>!!(g.buttons[j]&&g.buttons[j].pressed);
    const now={l:ax<-.4||bt(14),r:ax>.4||bt(15),f:bt(0)||bt(1)||bt(2)||bt(3)||bt(9)};
    const slot=mode==='local'?i:0;
    if(mode!=='menu'&&(mode==='local'||i===0))for(const k of['l','r','f'])if(now[k]!==prev[i][k])keys[slot][k]=now[k];
    prev[i]=now;
  });
}

// Paso fijo (constitución A2): la partida avanza siempre en ticks de 1/60 s, vaya el móvil
// a los FPS que vaya. Si un fotograma tarda más, se hacen varios ticks seguidos; el dibujo
// interpola entre el tick anterior y el actual para que se vea suave a 90 o 120 Hz.
const TICK=1/60,MAX_TICKS=8;
let last=performance.now(),acc=0,alfa=1;
function loop(t){
  const dt=Math.min(0.25,Math.max(0,(t-last)/1000));last=t;pollPads();
  if(mode==='local'||mode==='host'){
    acc+=dt;let n=0;
    while(acc>=TICK&&n<MAX_TICKS){
      acc-=TICK;n++;
      if(mode==='local')update(TICK);
      else if(mode==='host'){if(netTick(TICK)){update(TICK);sendState(TICK)}}
      else break; // se volvió al menú durante los ticks
    }
    if(n===MAX_TICKS)acc=0; // el móvil va muy lento: mejor ir más lento que dar saltos
    alfa=acc/TICK;
  }else{
    acc=0;alfa=1;
    // el invitado no simula: dibuja lo que recibe más su predicción, con el tiempo real
    if(mode==='guest')netTick(Math.min(0.033,dt));
  }
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const km={ArrowLeft:[0,'l'],ArrowRight:[0,'r'],' ':[0,'f'],a:[1,'l'],A:[1,'l'],d:[1,'r'],D:[1,'r'],w:[1,'f'],W:[1,'f']};
addEventListener('keydown',e=>{if(mode==='menu')return;const m=km[e.key];if(m&&(mode==='local'||m[0]===0)){keys[m[0]][m[1]]=true;e.preventDefault()}});
addEventListener('keyup',e=>{const m=km[e.key];if(m)keys[m[0]][m[1]]=false});
document.querySelectorAll('.pad button').forEach(b=>{
  const k=keys[+b.dataset.p],n=b.dataset.k;
